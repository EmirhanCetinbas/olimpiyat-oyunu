<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#76c94d"><meta name="description" content="Hayvan takımını geliştir, yarışları kazan ve Pati Şampiyonları liginde yüksel."><title>Pati Şampiyonları</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%238cda51'/%3E%3Ctext y='47' x='8' font-size='46'%3E🏆%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><style>.game{background:#86d850 url('assets/park-background.png') center top/100% auto repeat-y}.game:before{display:none}.upgrade-icon-box{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex:0 0 34px;overflow:hidden;border-radius:9px;background:linear-gradient(#fff9e4,#ffedc7);box-shadow:inset 0 1px #fff,0 1px 2px #17382c30}.upgrade-icon-box .upgrade-icon{width:29px;height:29px;border-radius:6px;background-color:transparent}.facility-icon{display:block;width:30px;height:30px;background-image:url('assets/facility-icons.png');background-repeat:no-repeat;background-size:200% 100%}.stadium-icon{background-position:left center}.ticket-icon{background-position:right center}.stadium{position:relative;background:url('assets/stadium.png') center top/100% 100% no-repeat}.race-head{position:relative;z-index:2;background:transparent;text-shadow:0 1px 2px #fff}.race-head .money,.race-head .clock,.race-head .team-summary{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none}.race-head .clock,.race-head .team-summary{text-shadow:0 1px 2px #001b}.field{background:transparent}.field>img{opacity:0}.upgrade>.green>span:first-child{flex:1;text-align:center;font-size:13px;font-weight:1000}.upgrade>.green .cost{display:flex;align-items:center;justify-content:center;gap:3px;align-self:stretch;min-width:44%;margin:-3px -4px -3px 0;padding:4px 5px;border-left:1px solid #087f1b;background:linear-gradient(#12b927,#078d18);border-radius:5px}.upgrade>.green .cost:before{content:'💵';font-size:13px;line-height:1}.income,.top,.race-strip{isolation:isolate}.runner{will-change:left,top}</style><main class="game" aria-label="Pati Şampiyonları oyunu">
<style>.gem-icon{width:27px;height:27px;position:absolute;left:8px}.gems{position:relative}.gems #gems{position:absolute;left:50%;transform:translateX(-50%)}.settings-icon{width:30px;height:30px}.bank-icon{width:25px;height:25px}.team-summary b{display:flex;align-items:center;justify-content:center;gap:3px}.team-icon{width:22px;height:22px}.cost-icon{width:18px!important;height:18px!important;flex:0 0 18px}.upgrade>.green .cost:before{display:none}.upgrade-icon-box .art{background-repeat:no-repeat;background-color:transparent}.income strong{-webkit-text-stroke:0;text-shadow:-1px 0 #10283b,1px 0 #10283b,0 -1px #10283b,0 1px #10283b}.stadium.idle:before{content:'';position:absolute;inset:0;z-index:3;backdrop-filter:blur(2.2px);background:#1232;pointer-events:none}.race-head{z-index:5}.race-call{z-index:6}.live-tag{z-index:7}</style>
<header class="top">
 <button class="profile cream" data-open="profile" aria-label="Profili aç"><span class="art avatar" data-art="avatar"></span><span><b id="level">Sv. 1</b><span class="xp"><i id="xp"></i></span></span></button>
 <div class="income"><small>Gelir /sn</small><strong id="income">₺57</strong></div>
 <button class="gems cream" data-open="shop" aria-label="Elmas mağazası"><span class="art gem-icon" data-art="gem"></span><b id="gems">8</b></button>
 <div class="quick"><button class="cream square" data-open="achievements" aria-label="Başarımlar"><span class="art" data-art="trophy"></span><i class="dot" id="ach-dot" hidden></i></button><button class="cream square" data-open="settings" aria-label="Ayarlar"><span class="art settings-icon" data-art="gear"></span></button></div>
 <button class="boost blue" id="boost">2x Aktif Et</button>
 <button class="branch" data-open="branches"><span class="art shoe" data-art="shoe"></span><b id="branch-name">100 METRE</b><span class="chevron">⌄</span></button>
</header>
<section class="stadium idle" aria-label="Canlı yarış">
 <div class="race-head"><div class="money cream"><span class="art bank-icon" data-art="bank"></span><b id="money">3.500</b></div><div class="clock"><strong id="round">1</strong><span id="timer">HAZIR</span></div><button class="team-summary" data-open="team"><small>TAKIMIN</small><b><span class="art team-icon" data-art="team"></span> <span id="power">100</span></b></button></div>
<div class="field" id="field"><img id="stadium-art" src="assets/stadium.png" alt="Çizgi film tarzında yeşil bir stadyumdaki kırmızı koşu pisti"><div class="hurdles" id="hurdles" aria-hidden="true"></div><div class="jump-flags" id="jump-flags" aria-label="Atlayış işaretleri"></div><div class="weight-hud" id="weight-hud" hidden><span id="weight-kg" class="weight-kg">80 KG</span><img id="weight-bar" class="weight-bar" src="assets/weights-barbell.png" alt="Halter"><span id="weight-result" class="weight-result" role="status" aria-live="polite"></span></div><div class="archery-hud" id="archery-hud" hidden><span class="archery-arrow" id="archery-arrow" hidden aria-hidden="true">➶</span><span class="archery-score" id="archery-score" role="status" aria-live="polite"></span></div><div class="runners" id="runners"></div><div class="race-call" id="race-call"><span>İlk madalyan seni bekliyor!</span><button class="green" id="start">Yarışa Başla <b>▶</b></button></div><div class="live-tag" id="live-tag" hidden>● CANLI</div></div>
</section>
<div class="race-strip"><span id="race-status">Çitanı geliştir, başlangıç çizgisine gel.</span><button id="risk-choice" type="button" hidden>Güvenli kilo</button><button id="auto" aria-pressed="true">↻ Otomatik <b>AÇIK</b></button></div>
<div class="skill-move" id="skill-move" hidden><div class="skill-track"><span class="skill-perfect"></span><span id="skill-meter"></span></div><button id="skill-button" class="green" type="button">Hamle!</button></div>
<section class="upgrades" id="upgrades" aria-label="Sporcu geliştirmeleri"></section>
<nav class="bottom cream" aria-label="Ana menü"><button data-open="inventory" aria-label="Envanter"><span class="nav-art" style="--nav-col:0" aria-hidden="true"></span><small>Envanter</small></button><button class="selected" data-open="race" aria-label="Oyun"><span class="nav-art" style="--nav-col:1" aria-hidden="true"></span><small>Oyun</small></button><button id="rewards-trigger" aria-label="Ödüller" aria-expanded="false" aria-controls="rewards-menu"><span class="nav-art" style="--nav-col:2" aria-hidden="true"></span><small>Ödüller</small></button><button data-open="campus" aria-label="Kampüs"><span class="nav-art" style="--nav-col:3" aria-hidden="true"></span><small>Kampüs</small></button><button data-open="shop" aria-label="Mağaza"><span class="nav-art" style="--nav-col:4" aria-hidden="true"></span><small>Mağaza</small></button></nav>
<div id="rewards-menu" class="rewards-menu" hidden role="menu" aria-label="Ödüller"><button data-open="daily-rewards" role="menuitem">🎁 Günlük ödül</button><button data-open="wheel" role="menuitem">🎡 Çarkıfelek</button><button data-open="achievements" role="menuitem">🏅 Başarımlar</button></div>
<div class="toast" role="status" id="toast"></div>
</main>
<dialog id="modal"><div class="modal-head"><h1 id="modal-title"></h1><button id="close" aria-label="Kapat">×</button></div><div id="modal-content"></div></dialog>
<script src="chests.js"></script><script src="moves.js"></script><script src="longjump.js"></script><script src="weights.js"></script><script src="archery.js"></script><script src="game.js"></script><script src="campus.js"></script></body></html>
